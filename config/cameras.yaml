cam_top:
  topics:
    rgb: /cam_top/color/image_raw
    pointcloud: /cam_top/depth/color/points
    camera_info: /cam_top/color/camera_info
  tf_frame: cam_top_color_optical_frame
  depth_tf_frame: cam_top_depth_optical_frame
  depth_clip_min: 0.20
  depth_clip_max: 3.5
  qos: reliable

cam_bottom:
  topics:
    rgb: /cam_bottom/color/image_raw
    pointcloud: /cam_bottom/depth/color/points
    camera_info: /cam_bottom/color/camera_info
  tf_frame: cam_bottom_color_optical_frame
  depth_tf_frame: cam_bottom_depth_optical_frame
  depth_clip_min: 0.20
  depth_clip_max: 3.5
  qos: reliable

wrist_left:
  topics:
    rgb: /wrist_left/color/image_raw
    pointcloud: /wrist_left/depth/color/points
    camera_info: /wrist_left/color/camera_info
  tf_frame: wrist_left_color_optical_frame
  depth_tf_frame: wrist_left_depth_optical_frame
  depth_clip_min: 0.05
  depth_clip_max: 1.5
  qos: best_effort

wrist_right:
  topics:
    rgb: /wrist_right/color/image_raw
    pointcloud: /wrist_right/depth/color/points
    camera_info: /wrist_right/color/camera_info
  tf_frame: wrist_right_color_optical_frame
  depth_tf_frame: wrist_right_depth_optical_frame
  depth_clip_min: 0.05
  depth_clip_max: 1.5
  qos: best_effort

fusion:
  output_topic: /fused/points
  status_topic: /fused/status
  output_frame: base_link
  publish_rate_hz: 10.0
  voxel_leaf_size: 0.01
  stale_timeout: 8.0
  workspace:
    x_min: -1.5
    x_max: 1.5
    y_min: -1.5
    y_max: 1.5
    z_min: 0.0
    z_max: 2.0